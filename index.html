<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Regen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M7 15.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 7.5h.5a4 4 0 0 1 0 8H7z%27 fill=%27%232a78d6%27/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#2a78d6">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="phone" id="phone">
  <div class="screen" id="screen">
    <header class="top" id="top">
      <button class="loc-pill back-btn" id="backBtn" type="button" hidden><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="backLabel">Overzicht</span></button>
      <button class="loc-pill" id="locBtn" type="button" aria-label="Locatie wijzigen">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2a6 6 0 0 0-6 6c0 4.2 6 10 6 10s6-5.8 6-10a6 6 0 0 0-6-6zm0 8.2A2.2 2.2 0 1 1 10 5.8a2.2 2.2 0 0 1 0 4.4z"/></svg>
        <span id="locName">Locatie</span>
        <svg class="ico chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="info-btn" id="infoBtn" type="button" aria-label="Info en bronnen" title="Info en bronnen"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v5M10 6.2v.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <h1 id="title">Overzicht</h1>
      <p class="subtitle" id="subtitle">&nbsp;</p>
      <p class="sunline" id="sunline" hidden></p>
    </header>
    <main id="content" aria-live="polite"></main>
  </div>


  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">Locatie</h2>
      <button class="text-btn" id="sheetClose" type="button">Gereed</button>
    </div>
    <button class="list-btn" id="geoBtn" type="button" aria-pressed="false">
      <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M17 3L3.5 8.6l5.6 2.3 2.3 5.6z" fill="currentColor"/></svg>
      <span id="geoLabel">Volg mijn locatie</span>
      <span class="hint" id="geoHint"></span>
      <svg class="ico check" viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <form id="searchForm" autocomplete="off">
      <div class="search-field">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="q" placeholder="Of kies een plaats in Nederland of België" aria-label="Zoek plaats" enterkeyhint="search">
      </div>
    </form>
    <ul class="list" id="results"></ul>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>
</div>

<div class="tooltip" id="tooltip" hidden></div>
<script src="app.js"></script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
