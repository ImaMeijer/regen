<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Regen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M7 15.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 7.5h.5a4 4 0 0 1 0 8H7z%27 fill=%27%232a78d6%27/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#2a78d6">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="phone" id="phone">
  <div class="screen" id="screen">
    <header class="top">
      <button class="loc-pill" id="locBtn" type="button" aria-label="Locatie wijzigen">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2a6 6 0 0 0-6 6c0 4.2 6 10 6 10s6-5.8 6-10a6 6 0 0 0-6-6zm0 8.2A2.2 2.2 0 1 1 10 5.8a2.2 2.2 0 0 1 0 4.4z"/></svg>
        <span id="locName">Locatie</span>
        <svg class="ico chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="title">Regen</h1>
      <p class="subtitle" id="subtitle">&nbsp;</p>
      <p class="sunline" id="sunline" hidden></p>
    </header>
    <main id="content" aria-live="polite"></main>
    <button class="info-btn" id="infoBtn" type="button"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v5M10 6.2v.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Info en bronnen</button>
  </div>

  <nav class="tabbar" aria-label="Weergrootheid">
    <button class="tab" data-tab="rain" type="button" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 7.5h.5a4 4 0 0 1 0 8H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Regen</span>
    </button>
    <button class="tab" data-tab="overview" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 2.8v1.4M9 13.8v1.4M2.8 9h1.4M13.8 9h1.4M4.6 4.6l1 1M12.4 12.4l1 1M4.6 13.4l1-1M12.4 5.6l1-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12.5 20.5a3.2 3.2 0 0 1-.4-6.37A4.3 4.3 0 0 1 20.4 13h.3a2.9 2.9 0 0 1 0 5.8h-8.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Overzicht</span>
    </button>
    <button class="tab" data-tab="temp" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a2 2 0 0 1 4 0v9.3a4 4 0 1 1-4 0V4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="17" r="1.6" fill="currentColor"/><path d="M12 10v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Temperatuur</span>
    </button>
    <button class="tab" data-tab="wind" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h11a2.5 2.5 0 1 0-2.5-2.5M3 12h15a2.5 2.5 0 1 1-2.5 2.5M3 16h8a2 2 0 1 1-2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Wind</span>
    </button>
    <button class="tab" data-tab="cloud" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 10h.5a4 4 0 0 1 0 8H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Bewolking</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">Locatie</h2>
      <button class="text-btn" id="sheetClose" type="button">Gereed</button>
    </div>
    <form id="searchForm" autocomplete="off">
      <div class="search-field">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="q" placeholder="Plaats in Nederland of België" aria-label="Zoek plaats" enterkeyhint="search">
      </div>
    </form>
    <ul class="list" id="results"></ul>
    <button class="list-btn" id="geoBtn" type="button">
      <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v3M10 15v3M2 10h3M15 10h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="10" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="10" r="1.5" fill="currentColor"/></svg>
      Huidige locatie gebruiken
    </button>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>
</div>

<div class="tooltip" id="tooltip" hidden></div>
<script src="app.js"></script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
